<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#137b65">
    <meta name="description" content="Explorez les performances des joueurs, les matchs et la couverture des données du projet Orion Football Ranking.">
    <title>Orion — Football Ranking</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Aller au contenu</a>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#overview" aria-label="Orion, vue d’ensemble">
          <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="currentColor"/><path d="M12 25 20 11l8 14M15.5 19h9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="28" r="2" fill="#aee8bf"/></svg>
          <span><span class="brand-word">orion<span class="brand-period">.</span></span><span class="brand-tag">FOOTBALL RESEARCH</span></span>
        </a>
        <nav class="main-nav" aria-label="Navigation principale">
          <button class="nav-button" data-page="overview" aria-current="page">Vue d’ensemble</button>
          <button class="nav-button" data-page="players">Joueurs</button>
          <button class="nav-button" data-page="matches">Matchs</button>
          <button class="nav-button" data-page="method">Données & méthode</button>
        </nav>
        <div class="topbar-meta"><span class="status-dot"></span><span>Échantillon de recherche</span></div>
      </header>
      <main id="main" class="workspace" tabindex="-1">
        <div class="page-heading">
          <div><div class="eyebrow" id="page-eyebrow">ORION FOOTBALL RANKING</div><h1 class="page-title" id="page-title">Le jeu, en perspective.</h1><p class="page-description" id="page-description">Des performances individuelles à une lecture plus juste du football.</p></div>
          <div class="heading-actions"><span class="snapshot-label" id="snapshot-label"></span><button id="export-button" class="button button-secondary" type="button"></button></div>
        </div>
        <section id="filters" class="filter-bar" aria-label="Filtres de l’échantillon">
          <div class="search-field"><span id="search-icon" aria-hidden="true"></span><input id="search-input" type="search" placeholder="Rechercher un joueur, un club…" aria-label="Rechercher un joueur ou un club" autocomplete="off"><kbd aria-hidden="true">/</kbd></div>
          <div class="select-field"><label for="league-filter">Compétition</label><select id="league-filter" aria-label="Compétition"><option value="all">Toutes les compétitions</option></select></div>
          <div class="select-field"><label for="season-filter">Saison</label><select id="season-filter" aria-label="Saison"><option value="all">Toutes les saisons</option></select></div>
          <div class="select-field"><label for="minutes-filter">Temps de jeu</label><select id="minutes-filter" aria-label="Temps de jeu"><option value="1">Joueurs entrés en jeu</option><option value="30">30 minutes et plus</option><option value="60">60 minutes et plus</option><option value="90">90 minutes et plus</option><option value="0">Inclure le banc</option></select></div>
          <button id="reset-filters" class="button button-ghost filter-reset" type="button" hidden>Réinitialiser</button>
        </section>
        <div id="filter-summary" class="filter-summary" aria-live="polite"></div>
        <div id="content"><div class="loading-state" role="status"><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:360px"></div><p>Chargement des données du projet…</p></div></div>
        <footer class="app-footer"><span>orion. <span>Comprendre la performance.</span></span><span>Source : PitchAPI · <a href="https://github.com/OrionQuantPlatform/Football_Ranking" target="_blank" rel="noopener noreferrer">Voir le projet <span aria-hidden="true">↗</span></a></span></footer>
      </main>
    </div>
    <div id="compare-tray" class="compare-tray" aria-label="Joueurs sélectionnés pour comparaison" hidden></div>
    <dialog id="detail-dialog" class="modal" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript><p>JavaScript est nécessaire pour filtrer et visualiser les données de ce dashboard.</p></noscript>
  </body>
</html>
